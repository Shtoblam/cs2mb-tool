name: Deploy project site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "logo.png"
      - "site.css"
      - "site.js"
      - "README.md"
      - "README.ru.md"
      - "docs/SECURITY.md"
      - "docs/SECURITY.ru.md"
      - "docs/USER_GUIDE.md"
      - "docs/USER_GUIDE.ru.md"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assemble the public site
        run: |
          mkdir -p _site/docs/assets
          cp index.html site.css site.js README.md README.ru.md _site/
          cp docs/SECURITY.md docs/SECURITY.ru.md docs/USER_GUIDE.md docs/USER_GUIDE.ru.md _site/docs/
          cp -r docs/assets/. _site/docs/assets/
          cp logo.png _site/
          touch _site/.nojekyll
      - name: Validate published files
        run: |
          test -s _site/index.html
          test -s _site/site.css
          test -s _site/site.js
          test -s _site/logo.png
          test -s _site/docs/SECURITY.md
          test -s _site/docs/SECURITY.ru.md
          test -s _site/docs/USER_GUIDE.md
          test -s _site/docs/USER_GUIDE.ru.md
          test -s _site/docs/assets/banners/banner.svg
          test -s _site/docs/assets/banners/banner.ru.svg
          test -s _site/docs/assets/brand/social-preview.png
          test -s _site/docs/assets/illustrations/engine.svg
          test -s _site/docs/assets/illustrations/pipeline.svg
          test -s _site/docs/assets/illustrations/navigation.svg
          test -s _site/docs/assets/illustrations/collision.svg
          test -s _site/docs/assets/illustrations/security.svg
          test -s _site/docs/assets/screenshots/app-v1.1-overview.png
          test -s _site/docs/assets/screenshots/app-v1.1-process.png
          test -s _site/docs/assets/screenshots/app-v1.1-library.png
          test -s _site/docs/assets/screenshots/app-v1.1-settings.png
          test -s _site/docs/assets/screenshots/app-v1.1-tutorial.png
          test -s _site/docs/assets/screenshots/app-v1.1-viewer-embedded.png
          test -s _site/docs/assets/screenshots/3dsvw-dust2.png
          test -s _site/docs/assets/screenshots/3dsvw-anubis.png
          test -s _site/docs/assets/screenshots/viewer-2d-dust2.png
          test -s _site/docs/assets/screenshots/website-current.png
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
