name: Python tests and security checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile project modules
        run: python -m compileall -q app tools movement simulation prototype
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run repository hygiene scan
        run: python tools/security_scan.py
