name: Python tests, SRI build and security checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Compile project modules
        run: python -m compileall -q app tools movement simulation prototype viewer3d
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run repository hygiene scan
        run: python tools/security_scan.py
      - name: Validate JavaScript
        run: |
          node --check site.js
          node --check viewer3d/assets/viewer.js

  sri-engine:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"
      - name: Build SRI
        shell: pwsh
        run: ./sri/build.ps1
      - name: Compile SRI without trimming
        run: dotnet build sri/Cs2mb.Sri/Cs2mb.Sri.csproj -c Release
      - name: Run tests against the built SRI
        shell: pwsh
        run: |
          $env:CS2MB_SRI = "${{ github.workspace }}\sri\dist\win-x64\cs2mb-sri.exe"
          python -m compileall -q app tools movement simulation prototype viewer3d
          python -m unittest discover -s tests -v
          python tools/security_scan.py
      - name: Download portable Python
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.13.3/python-3.13.3-embed-amd64.zip"
          Invoke-WebRequest $url -OutFile python-embeddable.zip
          $expected = "59ff76e16e6597de47474fb22be69e7191a89116910d728ab735079b078e52db"
          $actual = (Get-FileHash python-embeddable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Python runtime checksum mismatch: $actual" }
      - name: Build complete Windows package
        run: python tools/package_release.py --python-runtime python-embeddable.zip --sri sri/dist/win-x64/cs2mb-sri.exe
      - name: Verify extracted package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/CS2MB-*-win-x64.zip | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "cs2mb-package"
          Expand-Archive $zip.FullName -DestinationPath $target -Force
          $package = Join-Path $target "CS2MB"
          & "$package\tools\bin\sri\cs2mb-sri.exe" --version
          & "$package\runtime\python.exe" -c "import app.server; import tools.sri; import viewer3d.build; print('package imports ok')"
          if (-not (Test-Path "$package\viewer3d\assets\index.html")) { throw "missing 3DsVW assets" }
          if (-not (Test-Path "$package\viewer3d\assets\vendor\three.module.min.js")) { throw "missing three.js" }
          if (-not (Test-Path "$package\docs\USER_GUIDE.md")) { throw "missing user guide" }
          if (-not (Test-Path "$package\SHA256SUMS.txt")) { throw "missing SHA256SUMS.txt" }
          if (-not (Test-Path "$package\SBOM.spdx.json")) { throw "missing SBOM.spdx.json" }
