<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CS2 Map Balance — Source 2 map analysis, decoded locally</title>
  <desc id="desc">Social preview with the CS2MB identity, the internal Source 2 engine message and an original navigation/route diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15181b"/><stop offset=".6" stop-color="#20252a"/><stop offset="1" stop-color="#1b1117"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e45468"/><stop offset="1" stop-color="#8f1732"/></linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#e45468"/></linearGradient>
    <linearGradient id="glow"><stop offset="0" stop-color="#a51b36" stop-opacity=".38"/><stop offset="1" stop-color="#a51b36" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a4249" stroke-width="1" opacity=".55"/></pattern>
    <pattern id="mesh" width="72" height="62" patternUnits="userSpaceOnUse"><path d="M0 0L36 20L72 0M0 62L36 42L72 62M36 20V42" fill="none" stroke="#4a555e" stroke-width="1" opacity=".28"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#mesh)" opacity=".35"/>
  <ellipse cx="1040" cy="210" rx="430" ry="330" fill="url(#glow)"/>

  <g transform="translate(72 62)">
    <rect width="86" height="86" rx="17" fill="url(#brand)"/>
    <path d="M18 68V29L43 15L68 29V68L43 81Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M8 78L30 59L46 66L74 37" fill="none" stroke="#ff9a6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff"><circle cx="30" cy="59" r="4"/><circle cx="74" cy="37" r="4"/></g>
  </g>
  <text x="180" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f4f1f3">CS2 Map Balance</text>
  <text x="182" y="130" font-family="Consolas, monospace" font-size="12" letter-spacing="4" fill="#b7acb3">MAP ANALYSIS TOOLKIT</text>

  <text x="72" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#f6f2f4">Source 2 geometry,</text>
  <text x="72" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#f6f2f4">navigation and routes.</text>
  <text x="74" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#d3c9cf">Decoded locally. Explained honestly.</text>
  <text x="74" y="382" font-family="Consolas, monospace" font-size="14" fill="#b79fa9">PHYS · EntityLump · NAV · collision · timing · comparison</text>

  <g>
    <rect x="72" y="424" width="192" height="34" rx="5" fill="#5b1026" stroke="#a51b36"/>
    <text x="168" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ffd7de">PRE-ALPHA v1.0</text>
    <rect x="278" y="424" width="286" height="34" rx="5" fill="#1c2227" stroke="#3d474f"/>
    <text x="421" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f0d3d9">INTERNAL SOURCE 2 ENGINE</text>
  </g>
  <g font-family="Consolas, monospace" font-size="10" fill="#8f9aa2">
    <text x="74" y="540">LOCAL · READ-ONLY · NO TELEMETRY</text>
    <text x="74" y="562">9 ACTIVE-DUTY MAPS · EXISTING ROUTE MODEL PRESERVED</text>
  </g>

  <g transform="translate(720 120)">
    <rect x="0" y="0" width="496" height="404" rx="8" fill="#161b1f" stroke="#39434b"/>
    <text x="24" y="34" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#79b6d1">NAVIGATION / ROUTE VIEW</text>
    <text x="24" y="56" font-family="Consolas, monospace" font-size="9" fill="#76838c">ILLUSTRATIVE DIAGRAM · NOT A LIVE MAP</text>
    <g fill="#202930" stroke="#4c5962" stroke-width="1.4" stroke-linejoin="round">
      <path d="M42 128L116 94L188 122L174 190L96 206Z"/>
      <path d="M188 122L260 96L336 126L320 192L174 190Z"/>
      <path d="M336 126L414 108L470 146L450 214L320 192Z"/>
      <path d="M96 206L174 190L196 258L128 288Z"/>
      <path d="M320 192L450 214L430 286L350 300Z"/>
    </g>
    <g fill="none" stroke="#68767f" stroke-width="1.6">
      <path d="M116 152L174 144"/><path d="M260 148L320 156"/><path d="M414 164L450 178"/>
      <path d="M128 246L174 232"/><path d="M350 240L430 250"/>
    </g>
    <path d="M64 170L128 148L220 158L276 180L334 204L408 232L468 204" fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff"><circle cx="64" cy="170" r="5"/><circle cx="468" cy="204" r="5"/></g>
    <g fill="#e45468"><circle cx="220" cy="158" r="4"/><circle cx="334" cy="204" r="4"/></g>
    <g fill="none" stroke="#e45468" stroke-width="1.5"><path d="M174 144l-8-4v8z"/><path d="M320 156l-8-4v8z"/><path d="M450 178l-8-4v8z"/></g>

    <g>
      <rect x="24" y="326" width="142" height="54" rx="3" fill="#1d2328" stroke="#3d474f"/>
      <text x="38" y="344" font-family="Consolas, monospace" font-size="9" fill="#9da7af">AREAS</text>
      <text x="38" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f4f6">2 242</text>
      <text x="180" y="344" font-family="Consolas, monospace" font-size="9" fill="#9da7af">WALL SEGMENTS</text>
      <text x="180" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f4f6">29 470</text>
      <text x="330" y="344" font-family="Consolas, monospace" font-size="9" fill="#9da7af">TESTS</text>
      <text x="330" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f4f6">76</text>
    </g>
  </g>

  <text x="1210" y="608" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#7f8991">shtoblam.github.io/cs2mb-tool</text>
</svg>
