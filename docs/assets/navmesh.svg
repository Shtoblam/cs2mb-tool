<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Navigation mesh and directed routes</title>
  <desc id="desc">Original diagram of nav polygons, directed edges and a z-aware route through stacked areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a1d"/><stop offset="1" stop-color="#232a30"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#343d45" stroke-width="1" opacity=".6"/></pattern>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#e45468"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <text x="30" y="38" font-family="Consolas, monospace" font-size="11" letter-spacing="2" fill="#79b6d1">NAVIGATION</text>
  <text x="30" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#f2f4f6">Directed areas, not a straight line.</text>
  <text x="30" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9da7af">Polygons · connections · one-way links · z-levels</text>

