  <g fill="#e45468"><circle cx="282" cy="190" r="4"/><circle cx="410" cy="232" r="4"/></g>

  <g>
    <rect x="430" y="56" width="178" height="78" rx="3" fill="#1b2025" stroke="#3e4952"/>
    <text x="446" y="78" font-family="Consolas, monospace" font-size="9" letter-spacing="1" fill="#75c98a">LEGEND</text>
    <path d="M446 96h22" stroke="#e45468" stroke-width="2"/><text x="476" y="100" font-family="Consolas, monospace" font-size="9" fill="#b8c0c7">directed edge</text>
