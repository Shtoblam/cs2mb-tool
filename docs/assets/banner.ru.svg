  <ellipse cx="1050" cy="170" rx="330" ry="270" fill="url(#glow)"/>
  <g transform="translate(745 15)" fill="none" stroke="#655b63" stroke-width="1.5" opacity=".66">
    <path d="M38 58H196V108H266V32H438V107H604V205H544V260H642V326H430V284H292V338H142V273H38Z"/>
    <path d="M82 93H164V153H221V209H146V250H80ZM293 73H403V126H353V181H278V124ZM448 128H546V173H498V218H414V180ZM218 232H306V292H218ZM408 242H493V291H408Z" stroke-opacity=".52"/>
    <path d="M38 108H196M266 108H438M544 205H604M544 260H642M430 284H292M142 273V338"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M780 302C846 262 896 290 956 222S1055 117 1197 72" stroke="url(#brand)" stroke-width="10" opacity=".22"/>
