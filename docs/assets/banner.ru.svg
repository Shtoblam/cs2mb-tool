  <text x="137" y="83" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#f4eff1">CS2 Map Balance</text>
  <text x="137" y="108" font-family="Consolas, monospace" font-size="12" fill="#a9a1a8" letter-spacing="2">ЛОКАЛЬНЫЙ ИНСТРУМЕНТ АНАЛИЗА КАРТ</text>
  <text x="54" y="181" font-family="Segoe UI, sans-serif" font-size="36" font-weight="650" fill="#f5f0f2">Смотри на карту <tspan fill="#e45468">глубже радара.</tspan></text>
  <text x="56" y="221" font-family="Segoe UI, sans-serif" font-size="17" fill="#b9b0b7">Навигация · маршруты CT/T · геометрия · коллизии</text>
