<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CS2 Map Balance — инструмент анализа карт</title>
  <desc id="desc">Локальный инструмент анализа навигации, маршрутов, геометрии и коллизий карт Counter-Strike 2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19191c"/><stop offset=".58" stop-color="#242126"/><stop offset="1" stop-color="#190f15"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cf2c40"/><stop offset=".55" stop-color="#8f1732"/><stop offset="1" stop-color="#4a0822"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#454047" stroke-width="1" opacity=".45"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#94132f" stop-opacity=".34"/><stop offset="1" stop-color="#94132f" stop-opacity="0"/></radialGradient>
  </defs>
