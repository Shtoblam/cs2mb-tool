<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Internal Source 2 engine</title>
  <desc id="desc">A map VPK feeds the first-party cs2mb-source2 engine, which emits entity text and physics glTF for the existing CS2MB analysis layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15181b"/><stop offset="1" stop-color="#242a30"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e45468"/><stop offset="1" stop-color="#8f1732"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3a4249" stroke-width="1" opacity=".55"/></pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <text x="48" y="44" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#e45468">INTERNAL SOURCE 2 ENGINE</text>
  <text x="48" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2f4f6">Compiled resources decoded in-process.</text>
  <text x="48" y="101" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#aab2b9">No Source2Viewer-CLI. No resourceinfo. No .NET runtime for the user.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="48" y="132" width="248" height="132" rx="4" fill="#1c2227" stroke="#3d474f"/>
      <text x="70" y="162" font-size="17" font-weight="700" fill="#f2f4f6">Map VPK</text>
      <text x="70" y="186" font-family="Consolas, monospace" font-size="11" fill="#9da7af">&lt;map&gt;.nav</text>
      <text x="70" y="207" font-family="Consolas, monospace" font-size="11" fill="#9da7af">default_ents.vents_c</text>
      <text x="70" y="228" font-family="Consolas, monospace" font-size="11" fill="#9da7af">world_physics.vmdl_c</text>
      <text x="70" y="251" font-family="Consolas, monospace" font-size="10" fill="#75c98a">READ-ONLY EXTRACTION</text>
    </g>

    <g>
      <rect x="352" y="132" width="300" height="132" rx="4" fill="#241a20" stroke="#8f1732"/>
      <rect x="352" y="132" width="6" height="132" fill="url(#brand)"/>
      <text x="376" y="162" font-size="17" font-weight="700" fill="#fff">cs2mb-source2</text>
      <text x="376" y="186" font-family="Consolas, monospace" font-size="11" fill="#e9a0ad">EntityLump · PHYS · KV3</text>
      <text x="376" y="207" font-family="Consolas, monospace" font-size="11" fill="#9da7af">Zstandard / LZ4 decode</text>
      <text x="376" y="228" font-family="Consolas, monospace" font-size="11" fill="#9da7af">MIT ValveResourceFormat 20.1</text>
      <text x="376" y="251" font-family="Consolas, monospace" font-size="10" fill="#e45468">SELF-CONTAINED · WINDOWS X64</text>
    </g>

    <g>
      <rect x="708" y="132" width="248" height="132" rx="4" fill="#1c2227" stroke="#3d474f"/>
      <text x="730" y="162" font-size="17" font-weight="700" fill="#f2f4f6">Stable contracts</text>
      <text x="730" y="186" font-family="Consolas, monospace" font-size="11" fill="#79b6d1">entities.txt</text>
      <text x="730" y="207" font-family="Consolas, monospace" font-size="11" fill="#79b6d1">glTF + .bin</text>
      <text x="730" y="228" font-family="Consolas, monospace" font-size="11" fill="#9da7af">Hammer units · Source axes</text>
      <text x="730" y="251" font-family="Consolas, monospace" font-size="10" fill="#79b6d1">INTERACTAS PRESERVED</text>
    </g>

    <g>
      <rect x="1012" y="132" width="220" height="132" rx="4" fill="#1c2227" stroke="#3d474f"/>
      <text x="1034" y="162" font-size="17" font-weight="700" fill="#f2f4f6">Existing analysis</text>
      <text x="1034" y="186" font-family="Consolas, monospace" font-size="11" fill="#9da7af">NAV graph · collision</text>
      <text x="1034" y="207" font-family="Consolas, monospace" font-size="11" fill="#9da7af">routes · simulation</text>
      <text x="1034" y="228" font-family="Consolas, monospace" font-size="11" fill="#9da7af">balance · viewer</text>
      <text x="1034" y="251" font-family="Consolas, monospace" font-size="10" fill="#75c98a">UNCHANGED</text>
    </g>
  </g>

  <g stroke="#e45468" stroke-width="2" fill="none" opacity=".85">
    <path d="M296 198h40"/><path d="M328 193l8 5-8 5"/>
    <path d="M652 198h40"/><path d="M684 193l8 5-8 5"/>
    <path d="M956 198h40"/><path d="M988 193l8 5-8 5"/>
  </g>
  <text x="1232" y="300" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#7f8991">SHA-256 PROVENANCE · LOOPBACK · NO TELEMETRY</text>
</svg>
