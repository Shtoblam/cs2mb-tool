<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="title desc">
  <title id="title">CS2 Map Balance - модель безопасности</title>
  <desc id="desc">Без запуска игры, без доступа к памяти, без телеметрии, файлы только читаются.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191c"/><stop offset="1" stop-color="#232a2f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75c98a"/><stop offset="1" stop-color="#3e9d5a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="250" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="250" fill="#75c98a"/>
  <g transform="translate(48 48)">
    <path d="M50 0 L92 17 V52 C92 82 72 103 50 112 C28 103 8 82 8 52 V17 Z" fill="url(#shield)" opacity=".18" stroke="#75c98a" stroke-width="2"/>
    <path d="M30 54 L44 68 L72 38" fill="none" stroke="#75c98a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Segoe UI, sans-serif">
    <text x="190" y="58" font-size="28" font-weight="700" fill="#f0f2f4">Модель безопасности: локально, read-only, без процесса игры</text>
    <text x="190" y="85" font-family="Consolas, monospace" font-size="12" fill="#75c98a" letter-spacing="1">ЗЕЛЁНЫЙ СВЕТ ДЛЯ ЛОКАЛЬНОГО АЛЬФА-ТЕСТА</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#d5dade">
      <text x="190" y="125">✓ CS2 / STEAM НЕ ЗАПУСКАЮТСЯ</text>
      <text x="190" y="150">✓ НЕТ ДОСТУПА К ПАМЯТИ / ИНЖЕКЦИЙ</text>
      <text x="190" y="175">✓ НЕТ ТЕЛЕМЕТРИИ / ВНЕШНЕГО API</text>
      <text x="190" y="200">✓ ФАЙЛЫ ИГРЫ ТОЛЬКО ЧИТАЮТСЯ</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10" fill="#8f99a2">
      <text x="650" y="125">Приложение не подключается к игровым серверам и VAC.</text>
      <text x="650" y="150">Source2Viewer-CLI читает только извлечённый vmdl.</text>
      <text x="650" y="175">resourceinfo.exe — read-only диагностика Valve.</text>
      <text x="650" y="200">Всё работает на 127.0.0.1; аккаунты и токены не нужны.</text>
    </g>
  </g>
  <rect x="650" y="218" width="530" height="1" fill="#3d464e"/>
  <text x="1232" y="238" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#707980">CS2 MAP BALANCE 2.1 · AUDIT 2026-10-20</text>
</svg>
